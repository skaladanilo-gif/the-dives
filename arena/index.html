<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arena">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23121226'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='700' font-size='30' fill='white' text-anchor='middle'%3EA%3C/text%3E%3Ccircle cx='50' cy='16' r='5' fill='%23E23A87'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Arena Textos Científicos</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Jogos e resumos de Textos Científicos (UVV)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600;700&family=Tinos:wght@400;700&display=swap">
<style>
/* Layout: folha clara e silenciosa; conteúdo numa coluna central, cartões brancos, navegação num dock flutuante embaixo */
:root{
  --bg:#F2F2F4; --surface:#FFFFFF; --surface-2:#E9E9EE; --sunk:#F7F7F9;
  --line:rgba(18,18,38,.08); --line-2:rgba(18,18,38,.16);
  --text:#121226; --muted:#6A6A80; --dim:#9A9AAE;
  --primary:#1D1E5E; --on-primary:#FFFFFF;
  --accent:#E23A87; --accent-soft:rgba(226,58,135,.10);
  --gold:#E59A0B; --ok:#14996B; --ok-soft:rgba(20,153,107,.10); --bad:#E0424F; --bad-soft:rgba(224,66,79,.09);
  --paper:#FFFFFF; --paper-ink:#1B1A22;
  --shadow:0 1px 2px rgba(18,18,38,.04),0 10px 30px -14px rgba(18,18,38,.18);
  --shadow-lg:0 2px 4px rgba(18,18,38,.04),0 24px 60px -24px rgba(18,18,38,.32);
  --dock:rgba(255,255,255,.82);
  --sans:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Fira Code",ui-monospace,Menlo,monospace;
  --serif:"Tinos","Times New Roman",Times,serif;
  --r-s:12px; --r-m:18px; --r-l:26px;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E14; --surface:#17171F; --surface-2:#23232D; --sunk:#121219;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.15);
  --text:#F2F2F6; --muted:#9C9CB0; --dim:#6F6F84;
  --primary:#F2F2F6; --on-primary:#0E0E14;
  --accent:#FF5FA2; --accent-soft:rgba(255,95,162,.13);
  --gold:#F3AC23; --ok:#3DD39E; --ok-soft:rgba(61,211,158,.12); --bad:#FF6B76; --bad-soft:rgba(255,107,118,.12);
  --paper:#FBFAF7; --paper-ink:#1B1A22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -24px rgba(0,0,0,.8);
  --dock:rgba(30,30,40,.82);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E14; --surface:#17171F; --surface-2:#23232D; --sunk:#121219;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.15);
  --text:#F2F2F6; --muted:#9C9CB0; --dim:#6F6F84;
  --primary:#F2F2F6; --on-primary:#0E0E14;
  --accent:#FF5FA2; --accent-soft:rgba(255,95,162,.13);
  --gold:#F3AC23; --ok:#3DD39E; --ok-soft:rgba(61,211,158,.12); --bad:#FF6B76; --bad-soft:rgba(255,107,118,.12);
  --paper:#FBFAF7; --paper-ink:#1B1A22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -24px rgba(0,0,0,.8);
  --dock:rgba(30,30,40,.82);
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--sans);font-weight:600;letter-spacing:-.03em;line-height:1.05;text-wrap:balance;margin:0}
.eyebrow{font:500 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}
.full{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:500;font-size:15px;background:var(--primary);color:var(--on-primary);transition:transform .15s var(--ease),opacity .15s}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.ghost:hover{opacity:1;box-shadow:inset 0 0 0 1px var(--text)}
.btn.accent{background:var(--accent);color:#fff}
.btn.small{padding:8px 14px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px;padding:6px 0;font-size:14px}
.link:hover{color:var(--text)}
.round{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;flex:none}
.round:hover{box-shadow:inset 0 0 0 1px var(--line-2)}

/* Marca */
.logo{display:inline-flex;align-items:center;gap:2px;font:700 19px/1 var(--sans);letter-spacing:.14em}
.logo i{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:3px;display:inline-block;transform:translateY(-6px)}
.av{display:block;border-radius:50%;overflow:hidden;flex:none;background:var(--surface-2)}
.av svg{display:block;width:100%;height:100%}

/* ===== Perfis ===== */
.picker{display:flex;flex-direction:column;padding-block:24px 28px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.picker main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:40px;padding-block:48px}
.picker h1{font-size:clamp(34px,6vw,52px)}
.picker .sub{margin:12px 0 0;color:var(--muted)}
.profiles{display:flex;flex-wrap:wrap;justify-content:center;gap:28px 30px;max-width:760px}
.ptile{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:12px;width:112px;position:relative}
.ptile .av{width:112px;height:112px;box-shadow:var(--shadow);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.ptile:hover .av,.ptile:focus-visible .av{transform:translateY(-4px) scale(1.03);box-shadow:var(--shadow-lg)}
.ptile:focus-visible{outline:none}
.ptile .nm{font-weight:500;font-size:15px;max-width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptile .add{width:112px;height:112px;border-radius:50%;border:1.5px dashed var(--line-2);display:grid;place-items:center;color:var(--muted);transition:border-color .2s,color .2s}
.ptile:hover .add{border-color:var(--text);color:var(--text)}
.ptile .badge{position:absolute;top:0;right:0;width:34px;height:34px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;box-shadow:var(--shadow)}
.foot{text-align:center;font-size:12px;color:var(--dim);margin:0}

/* ===== Editor ===== */
.sheet{padding-block:20px 56px}
.editor{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:40px;align-items:start;margin-top:28px}
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--surface);border-radius:var(--r-l);padding:28px;box-shadow:var(--shadow)}
.preview .av{width:180px;height:180px;max-width:100%}
.preview .who{font-weight:600;font-size:20px;letter-spacing:-.02em;min-height:1.4em;text-align:center;overflow-wrap:anywhere}
.form{display:flex;flex-direction:column;gap:28px;min-width:0}
.form h1{font-size:clamp(30px,4.6vw,42px)}
.group h3{font:500 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:36px;height:36px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .15s var(--ease)}
.sw:hover{transform:scale(1.08)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.th{width:58px;height:58px;border-radius:50%;padding:0;border:0;overflow:hidden;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);transition:transform .15s var(--ease)}
.th:hover{transform:scale(1.06)}
.th[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.th svg{display:block;width:100%;height:100%}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lbl{font-weight:500;font-size:14px}
.field input{background:var(--surface);border:0;box-shadow:inset 0 0 0 1px var(--line-2);border-radius:var(--r-s);padding:13px 15px;color:var(--text);font:400 17px var(--sans);width:100%;transition:box-shadow .15s}
.field input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--text)}
.field input.pin{font-family:var(--mono);letter-spacing:.5em;width:150px}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:14px;min-height:20px;font-weight:500;margin:0}
.pinrow{display:flex;gap:12px;flex-wrap:wrap}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ===== PIN ===== */
.pinscreen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding-block:32px;text-align:center}
.pinscreen .av{width:88px;height:88px;box-shadow:var(--shadow)}
.pinscreen h1{font-size:30px}
.dots{display:flex;gap:14px;margin:6px 0 0}
.dots i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-2);transition:background .12s,transform .2s var(--ease)}
.dots i.on{background:var(--text);box-shadow:none;transform:scale(1.15)}
.dots.shake{animation:shake .4s}
.pad{display:grid;grid-template-columns:repeat(3,68px);gap:14px 22px;margin-top:8px}
.pad button{height:68px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font:400 26px var(--sans);transition:transform .1s,background .1s}
.pad button:active{transform:scale(.94);background:var(--surface-2)}
.pad .blank{visibility:hidden}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ===== App ===== */
.apphead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.mebtn{display:flex;align-items:center;gap:10px;background:var(--surface);border:0;border-radius:999px;padding:4px 14px 4px 4px;box-shadow:var(--shadow)}
.mebtn .av{width:32px;height:32px}
.mebtn .nm{font-weight:500;font-size:14px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--dock);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);box-shadow:var(--shadow-lg),inset 0 0 0 1px var(--line)}
.dock button{border:0;background:none;border-radius:999px;padding:10px 16px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--muted);transition:background .2s,color .2s}
.dock button:hover{color:var(--text)}
.dock button[aria-current="page"]{background:var(--text);color:var(--bg)}
main.view{padding-block:12px 140px;display:flex;flex-direction:column;gap:40px}

.hero{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.hero h1{font-size:clamp(40px,7vw,68px);font-weight:600}
.hero h1 span{color:var(--muted)}
.statline{display:flex;flex-wrap:wrap;gap:8px 24px;margin:4px 0 0;font-size:15px;color:var(--muted)}
.statline b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.statline b.hl{color:var(--accent)}
.hint-card{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r-m);padding:14px 18px;font-size:14px}
.hint-card b{font-weight:600}

.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.game{display:flex;align-items:center;gap:18px;text-align:left;border:0;background:var(--surface);border-radius:var(--r-l);padding:20px;box-shadow:var(--shadow);transition:transform .3s var(--ease),box-shadow .3s var(--ease);min-width:0}
.game:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.game .ico{width:52px;height:52px;border-radius:16px;background:var(--ct);color:var(--c);display:grid;place-items:center;flex:none}
.game .tx{flex:1;min-width:0}
.game h3{font-size:19px;font-weight:600;letter-spacing:-.02em}
.game p{margin:3px 0 0;color:var(--muted);font-size:14px}
.game .best{font-size:12px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.game.feature{grid-column:1/-1;padding:28px;gap:24px}
.game.feature .ico{width:64px;height:64px;border-radius:20px}
.game.feature h3{font-size:26px}

.sectionhead h2{font-size:clamp(30px,5vw,42px)}
.sectionhead p{margin:8px 0 0;color:var(--muted)}

/* Resumos */
.tlist{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden}
.trow{display:grid;grid-template-columns:44px minmax(0,1fr) auto 16px;gap:14px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:18px 20px;transition:background .15s}
.trow:first-child{border-top:0}
.trow:hover{background:var(--sunk)}
.trow .n{font:500 14px var(--mono);color:var(--dim)}
.trow b{display:block;font-weight:500}
.trow small{color:var(--muted);font-size:13px}
.trow .acc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.trow .chev{color:var(--dim)}
.article{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:48px;align-items:start}
.article h1{font-size:clamp(36px,6vw,56px)}
.article .lead{color:var(--muted);margin:12px 0 0;font-size:18px}
.facts{display:flex;flex-direction:column;margin-top:32px}
.fact{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;padding:18px 0;border-top:1px solid var(--line)}
.fact h3{font:600 15px/1.4 var(--sans);letter-spacing:-.01em}
.fact p{margin:0;max-width:60ch;color:var(--text)}
.fact p b{font-weight:600}
.side{position:sticky;top:24px;display:flex;flex-direction:column;gap:12px}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{font-size:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);border-radius:999px;padding:4px 10px;color:var(--muted)}
.side .btn{justify-content:flex-start}

/* Ranking */
.top3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.t3{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow);padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0}
.t3 .av{width:72px;height:72px}
.t3.first .av{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--gold)}
.t3 .place{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.t3 .nm{font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t3 .pts{font-size:28px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.t3 .pts small{display:block;font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden}
.lrow{display:grid;grid-template-columns:28px 40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow.me-row{background:var(--accent-soft)}
.lrow .pos{color:var(--dim);font-variant-numeric:tabular-nums;font-size:14px}
.lrow .av{width:40px;height:40px}
.lrow .who{min-width:0}
.lrow .who b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .who small{display:block;font:400 12px var(--serif);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .pts{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.lrow .pts small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.note{font-size:13px;color:var(--dim);text-align:center;margin:0}

/* Perfil */
.profile{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:24px;align-items:start}
.card{background:var(--surface);border-radius:var(--r-l);padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;min-width:0}
.idcard{align-items:center;text-align:center;position:sticky;top:24px}
.idcard .av{width:132px;height:132px}
.idcard h2{font-size:30px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:18px}
.nums b{display:block;font-size:30px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.nums span{font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:14px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:6px 12px;align-items:center}
.bar span{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar em{font-size:13px;font-style:normal;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.bar i{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:block}
.bar i::before{content:"";display:block;height:100%;width:var(--w);background:var(--text);border-radius:99px}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rec{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:var(--r-s);padding:10px 12px;min-width:0}
.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.rec span{font-size:13px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec b{font-weight:600;font-variant-numeric:tabular-nums}
.code{font:400 12px/1.5 var(--mono);background:var(--sunk);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r-s);padding:12px;word-break:break-all;max-height:96px;overflow:auto;user-select:all;color:var(--muted)}

 {t:3,q:"Qual conectivo foi mal usado?",o:["Queria falar com Débora, até mesmo porque não sei onde encontrá-la.","Não saber onde encontrar Débora aumenta minha vontade de falar com ela.","Vou procurar Débora amanhã."],c:0,e:"O conectivo cria uma relação falsa entre as ideias."},
 {t:3,q:"Qual frase usa clichê?",o:["No mundo de hoje, a tecnologia é uma faca de dois gumes.","A tecnologia ampliou o acesso a artigos científicos.","O uso de repositórios digitais cresceu no período."],c:0,e:"Expressões batidas passam falta de argumento."},
 {t:4,q:"Qual frase fere a impessoalidade?",o:["Em minha pesquisa, eu provei que o método funciona.","Os resultados indicam que o método funciona.","A análise mostrou eficácia em 72% dos casos."],c:0,e:"Evite “eu” e “minha pesquisa” no texto científico."},
 {t:4,q:"Qual frase falta precisão?",o:["É grande o número de pessoas infectadas.","O número de infectados foi 18% maior que em 2023.","Foram registrados 1.240 casos no período."],c:0,e:"“Grande” comparado com o quê? Use dados."},
 {t:6,q:"Qual frase não dá crédito ao autor?",o:["Segundo Gil (2022), o problema deve ser testável.","O problema deve ser testável, como disse um autor aí.","Para Gonsalves (2011), os objetivos devem ser atingíveis."],c:1,e:"Citação indireta exige sobrenome e ano."},
 {t:5,q:"Qual NÃO serve como objetivo de pesquisa?",o:["Analisar a linguagem do telejornal X.","Descrever o público do telejornal X.","Eu acho que o telejornal X é chato."],c:2,e:"Objetivo começa com verbo no infinitivo e não é opinião."},
 {t:8,q:"Primeira menção de uma sigla no texto. Qual está fora da norma?",o:["A ABNT define as regras de formatação.","A Associação Brasileira de Normas Técnicas (ABNT) define as regras.","As regras de formatação seguem normas técnicas."],c:0,e:"Na primeira vez: nome completo e a sigla entre parênteses."},
 {t:9,q:"Qual é o prompt mais fraco?",o:["Me fala sobre marketing.","Como professor de marketing, elabore 5 ideias de aula para calouros, em tópicos.","Analise este artigo e liste as 3 principais conclusões em até 100 palavras."],c:0,e:"Sem contexto, instrução clara nem especificação."},
 {t:6,q:"Qual citação direta curta está fora da norma?",o:["Para Gonsalves (2011, p. 58), “os objetivos devem ser reais e atingíveis”.","Os objetivos devem ser reais e atingíveis, Gonsalves 2011.","“A leitura constitui-se em fator decisivo de estudo” (Marconi; Lakatos, 2003, p. 19)."],c:1,e:"Faltam aspas, parênteses e página."}
];

</script>
<script>
(() => {
"use strict";
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (h, m) => (h + m) ? Math.round(100 * h / (h + m)) : 0;
const pad2 = n => String(n).padStart(2, "0");
const topicName = id => (TOPICS.find(t => t.id === id) || {}).title || "";
const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

/* ---------- Armazenamento (neste navegador) ---------- */
const KEY = "arenaTC.v2";
let DB = { profiles: [] };
let storageOK = true;
function load() {
  try { localStorage.removeItem("arenaTC.v1"); } catch (e) {}
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.profiles)) DB = d; }
    localStorage.setItem(KEY + ".t", "1"); localStorage.removeItem(KEY + ".t");
  } catch (e) { storageOK = false; }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); storageOK = true; } catch (e) { storageOK = false; } }
const byId = id => DB.profiles.find(p => p.id === id);
const newStats = () => ({ h: 0, m: 0, g: 0, best: 0, bt: {}, bg: {} });

async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ":" + pin);
  try {
    const buf = await crypto.subtle.digest("SHA-256", data);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    let h = 5381; for (const ch of salt + pin) h = ((h << 5) + h + ch.charCodeAt(0)) | 0;
    return "x" + (h >>> 0).toString(16);
  }
}
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ---------- Avatares ---------- */
const AV = {
  bg: ["#E23A87","#F3AC23","#5B5FE0","#23246D","#1FB6A6","#8E44D9","#FF7A45","#C9C3F2"],
  skin: ["#FFE0C7","#F2C3A0","#DDA174","#B97A4C","#8B5634","#5E3A22"],
  hairColor: ["#1E1A2E","#5A3A22","#A8652E","#E7C26B","#C9C3F2","#E23A87"],
  shirt: ["#23246D","#E23A87","#F3AC23","#F5F3FF","#1FB6A6","#141026"],
  hair: ["curto","franja","longo","cacheado","black","coque","raspado","careca"],
  eyes: ["normal","feliz","piscando","sono"],
  mouth: ["sorriso","aberta","neutra","surpresa"],
  acc: ["nenhum","oculos","capelo","fones","bone","laco"]
};
const AVL = { curto:"Curto", franja:"Franja", longo:"Longo", cacheado:"Cacheado", black:"Black power", coque:"Coque", raspado:"Raspado", careca:"Careca",
  normal:"Normal", feliz:"Feliz", piscando:"Piscando", sono:"Com sono", sorriso:"Sorriso", aberta:"Risada", neutra:"Neutra", surpresa:"Surpresa",
  nenhum:"Nenhum", oculos:"Óculos", capelo:"Capelo", fones:"Fones", bone:"Boné", laco:"Laço" };
const randAv = () => { const r = k => Math.random() * AV[k].length | 0; return { bg:r("bg"), skin:r("skin"), hair:r("hair"), hairColor:r("hairColor"), shirt:r("shirt"), eyes:r("eyes"), mouth:r("mouth"), acc:r("acc") }; };

function avatarSVG(c) {
  const s = AV.skin[c.skin], h = AV.hairColor[c.hairColor], sh = AV.shirt[c.shirt], bg = AV.bg[c.bg], ink = "#1B1530";
  let back = "", front = "";
  const top = `<path d="M28 47 Q27 21 50 21 Q73 21 72 47 Q68 33 50 32 Q33 32 28 47Z" fill="${h}"/>`;
  switch (AV.hair[c.hair]) {
    case "curto": front = top; break;
    case "franja": front = `<path d="M27 50 Q25 19 50 19 Q75 19 73 50 L70 41 Q61 30 44 37 Q35 40 30 45Z" fill="${h}"/>`; break;
    case "longo": back = `<path d="M25 50 Q23 17 50 17 Q77 17 75 50 L78 84 Q70 89 64 82 L64 58 L36 58 L36 82 Q30 89 22 84Z" fill="${h}"/>`;
      front = `<path d="M28 46 Q29 23 50 23 Q71 23 72 46 Q62 31 50 32 Q37 32 28 46Z" fill="${h}"/>`; break;
    case "cacheado": front = [[29,43,8],[31,32,8],[39,24,8.5],[50,21,9],[61,24,8.5],[69,32,8],[71,43,8]].map(([x,y,r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${h}"/>`).join(""); break;
    case "black": back = `<circle cx="50" cy="40" r="31" fill="${h}"/>`; break;
    case "coque": front = `<circle cx="50" cy="15" r="8.5" fill="${h}"/>` + top; break;
    case "raspado": front = `<path d="M29 45 Q29 24 50 24 Q71 24 71 45 Q62 35 50 35 Q38 35 29 45Z" fill="${h}" opacity=".55"/>`; break;
  }
  const eye = (x, kind) => {
    if (kind === "feliz") return `<path d="M${x-3.5} 51.5 Q${x} 46.5 ${x+3.5} 51.5" stroke="${ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    if (kind === "sono") return `<path d="M${x-3.5} 51 L${x+3.5} 51" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/>`;
    if (kind === "wink") return `<path d="M${x-3.5} 50 Q${x} 53 ${x+3.5} 50" stroke="${ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    return `<circle cx="${x}" cy="50" r="2.9" fill="${ink}"/><circle cx="${x+1}" cy="49" r=".9" fill="#fff"/>`;
  };
  const ek = AV.eyes[c.eyes];
  const eyes = ek === "piscando" ? eye(42.5, "normal") + eye(57.5, "wink") : eye(42.5, ek) + eye(57.5, ek);
  let mouth;
  switch (AV.mouth[c.mouth]) {
    case "aberta": mouth = `<path d="M43 58 Q50 70 57 58Z" fill="${ink}"/><path d="M46.5 63 Q50 61 53.5 63 Q50 66.5 46.5 63Z" fill="#FF7A9C"/>`; break;
    case "neutra": mouth = `<path d="M45 61 L55 61" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/>`; break;
    case "surpresa": mouth = `<ellipse cx="50" cy="61" rx="3" ry="3.6" fill="${ink}"/>`; break;
    default: mouth = `<path d="M43 59 Q50 66 57 59" stroke="${ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  }
  let acc = "";
  switch (AV.acc[c.acc]) {
    case "oculos": acc = `<g stroke="${ink}" stroke-width="2" fill="rgba(255,255,255,.18)"><circle cx="42.5" cy="50" r="6.3"/><circle cx="57.5" cy="50" r="6.3"/></g><path d="M48.8 50 L51.2 50 M36.2 49 L30 47 M63.8 49 L70 47" stroke="${ink}" stroke-width="2"/>`; break;
    case "capelo": acc = `<path d="M36 23 L36 31 Q50 37 64 31 L64 23Z" fill="#14102E"/><path d="M50 31 L26 22 L50 12 L74 22Z" fill="#14102E"/><path d="M50 21.5 L71 25 L71 37" stroke="#F3AC23" stroke-width="1.8" fill="none"/><circle cx="71" cy="38.5" r="2.4" fill="#F3AC23"/>`; break;
    case "fones": acc = `<path d="M27 50 Q26 17 50 17 Q74 17 73 50" stroke="#14102E" stroke-width="4" fill="none"/><rect x="21" y="42" width="10" height="16" rx="4.5" fill="#14102E"/><rect x="69" y="42" width="10" height="16" rx="4.5" fill="#14102E"/><circle cx="26" cy="50" r="2.2" fill="#E23A87"/><circle cx="74" cy="50" r="2.2" fill="#E23A87"/>`; break;
    case "bone": { const cc = AV.bg[(c.bg + 3) % AV.bg.length]; acc = `<path d="M28 42 Q28 18 50 18 Q72 18 72 42Z" fill="${cc}"/><path d="M50 40 Q74 36 87 43 Q73 48 50 44Z" fill="${cc}"/><path d="M50 40 Q74 36 87 43" stroke="rgba(0,0,0,.25)" stroke-width="1.5" fill="none"/><circle cx="50" cy="19" r="2" fill="rgba(0,0,0,.25)"/>`; } break;
    case "laco": acc = `<path d="M64 22 L55 15.5 L55 28.5Z M64 22 L73 15.5 L73 28.5Z" fill="#E23A87"/><circle cx="64" cy="22" r="3.2" fill="#FF6AAE"/>`; break;
  }
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><rect width="100" height="100" fill="${bg}"/><circle cx="82" cy="18" r="26" fill="rgba(255,255,255,.12)"/>${back}<path d="M16 100 Q17 77 50 75 Q83 77 84 100Z" fill="${sh}"/><path d="M43 76.5 L50 84 L57 76.5" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="2"/><rect x="43" y="63" width="14" height="13" rx="4" fill="${s}"/><rect x="43" y="66" width="14" height="4" fill="rgba(0,0,0,.08)"/><circle cx="29.5" cy="50" r="4.6" fill="${s}"/><circle cx="70.5" cy="50" r="4.6" fill="${s}"/><ellipse cx="50" cy="48" rx="21" ry="23" fill="${s}"/>${front}${eyes}<circle cx="37" cy="57.5" r="3.6" fill="#FF6AAE" opacity=".3"/><circle cx="63" cy="57.5" r="3.6" fill="#FF6AAE" opacity=".3"/>${mouth}${acc}</svg>`;
}
const avBox = (p, cls = "av") => `<span class="${cls}" role="img" aria-label="Avatar de ${esc(p.name)}">${avatarSVG(p.av)}</span>`;

/* ---------- Ícones ---------- */
const I = {
  bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  vf:'<path d="m4 12 4 4 8-9"/><path d="m15 15 5 5M20 15l-5 5"/>',
  link:'<path d="M9 15 15 9"/><path d="M11 6l1.5-1.5a4 4 0 0 1 5.7 5.7L16.6 12"/><path d="M13 18l-1.5 1.5a4 4 0 0 1-5.7-5.7L7.4 12"/>',
  sort:'<rect x="3" y="13" width="7" height="8" rx="1.5"/><rect x="14" y="13" width="7" height="8" rx="1.5"/><path d="M12 3v6M9 6l3 3 3-3"/>',
  order:'<path d="M10 6h11M10 12h11M10 18h11"/><path d="M4 5h1.5v3M4 11.5h2.5L4 14.5h2.5M4 17.5h2.5V20H4"/>',
  quote:'<path d="M5 4h14v16H5z"/><path d="M8.5 9h7M8.5 13h4.5M8.5 17h6"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
  grid:'<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',
  book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 21H20"/>',
  trophy:'<path d="M8 4h8v6a4 4 0 0 1-8 0z"/><path d="M8 6H4.5a3 3 0 0 0 3.5 4M16 6h3.5a3 3 0 0 1-3.5 4M12 14v4M8.5 21h7M10 18h4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  pencil:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  close:'<path d="M6 6l12 12M18 6 6 18"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  dice:'<rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/>',
  del:'<path d="M15 6 9 12l6 6"/><path d="M9 12h11"/>',
  chev:'<path d="m9 6 6 6-6 6"/>',
  refresh:'<path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/>',
  more:'<circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/>',
  cap:'<path d="M2 9.5 12 5l10 4.5L12 14z"/><path d="M6 11.5V16c3.5 2.4 8.5 2.4 12 0v-4.5"/>'
};
const ic = (n, s = 22, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ---------- Catálogo de jogos ---------- */
const GAMES = [
  { id:"quiz",  name:"Quiz Relâmpago",      desc:"10 perguntas, 20 segundos cada.",         c:"#E23A87", ico:"bolt",   bank:() => QUIZ },
  { id:"vf",    name:"Verdadeiro ou Falso", desc:"60 segundos para responder o máximo.",    c:"#12A386", ico:"vf",     bank:() => VF },
  { id:"pares", name:"Ligue os Pares",      desc:"Conecte cada termo ao seu conceito.",     c:"#E0950A", ico:"link",   bank:() => PAIRS },
  { id:"classe",name:"Classifique",         desc:"Mande cada item para a caixa certa.",     c:"#6E5BF0", ico:"sort",   bank:() => SORTS },
  { id:"ordem", name:"Ordem Certa",         desc:"Toque nas etapas na sequência correta.",  c:"#F0612E", ico:"order",  bank:() => ORDERS },
  { id:"abnt",  name:"Monte a Referência",  desc:"Monte cada referência no padrão ABNT.",   c:"#4F52C8", ico:"quote",  bank:() => REFS.map(r => ({ ...r, t:7 })) },
  { id:"ruido", name:"Caça ao Ruído",       desc:"Ache a frase com problema.",              c:"#1C8FD6", ico:"search", bank:() => NOISE }
];
const gameById = id => GAMES.find(g => g.id === id);
const topicsOf = g => [...new Set(g.bank().map(x => x.t))].sort((a, b) => a - b);
const tint = c => c + "1C";

/* ---------- Estado ---------- */
const S = { view:"picker", manage:false, me:null, tab:"jogos", topic:null, draft:null, pin:null, modal:null, G:null, introMsg:null };
let timers = [];
const clearTimers = () => { timers.forEach(t => { clearInterval(t); clearTimeout(t); }); timers = []; };
const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };

function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}
const me = () => byId(S.me);
const ranked = () => DB.profiles.slice().sort((a, b) => b.st.h - a.st.h || pct(b.st.h, b.st.m) - pct(a.st.h, a.st.m) || a.name.localeCompare(b.name));
const posOf = id => ranked().findIndex(p => p.id === id) + 1;

/* ---------- Render raiz ---------- */
function render() {
  let html = "";
  if (S.view === "picker") html = vPicker();
  else if (S.view === "editor") html = vEditor();
  else if (S.view === "pin") html = vPin();
  else if (S.view === "intro") html = vIntro();
  else if (S.view === "app") html = vApp();
  else if (S.view === "game") html = vGame();
  if (S.modal) html += vModal();
  app.innerHTML = html;
  if (S.view === "editor") bindEditor();
  if (S.view === "intro") runIntro();
  if (S.view === "game" && S.G && !S.G.done && GM[S.G.id].after) GM[S.G.id].after(S.G);
  const f = app.querySelector("[data-autofocus]"); if (f) f.focus({ preventScroll:true });
}
const go = (patch) => { Object.assign(S, patch); render(); window.scrollTo(0, 0); };

const logo = () => `<span class="logo" aria-label="Arena">ARENA<i></i></span>`;
const footNote = `Projeto de estudo feito por alunos para Textos Científicos. Não é um canal oficial da UVV.`;

/* ---------- Tela: perfis ---------- */
function vPicker() {
  const ps = DB.profiles;
  const tiles = ps.map(p => `<button class="ptile" data-a="pickProfile" data-id="${p.id}">${avBox(p)}${S.manage ? `<span class="badge">${ic("pencil", 16)}</span>` : ""}<span class="nm">${esc(p.name)}</span></button>`).join("");

}

/* ---------- Editor de perfil ---------- */
function vEditor() {
  const d = S.draft, isNew = d.mode === "new";
  return `<div class="sheet wrap">
    <div class="topbar"><button class="round" data-a="editorBack" aria-label="Voltar">${ic("back", 18)}</button>${logo()}<span style="width:40px"></span></div>

        <h1>${isNew ? "Crie seu perfil" : "Editar perfil"}</h1>

        <div id="opts" style="display:flex;flex-direction:column;gap:24px">${optsHTML()}</div>
        <div class="field"><span class="lbl">${isNew ? "PIN de 4 números" : "Novo PIN (opcional)"}</span>
          <div class="pinrow">
            <input id="f-pin1" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN" placeholder="PIN" value="${esc(d.pin1)}">
            <input id="f-pin2" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Repita o PIN" placeholder="Repita" value="${esc(d.pin2)}">

async function saveDraft() {
  const d = S.draft, err = document.getElementById("ferr");
  const name = d.name.trim().replace(/\s+/g, " ");
  const fail = m => { err.textContent = m; };
  if (name.length < 2) return fail("Digite um nome com pelo menos 2 caracteres.");
  if (DB.profiles.some(p => p.id !== d.id && p.name.toLowerCase() === name.toLowerCase())) return fail("Esse nome já existe neste aparelho. Escolha outro.");
  const wantsPin = d.mode === "new" || d.pin1 || d.pin2;
  if (wantsPin) {
    if (!/^\d{4}$/.test(d.pin1)) return fail("O PIN precisa ter 4 números.");
    if (d.pin1 !== d.pin2) return fail("Os dois PINs estão diferentes. Digite de novo.");
  }
  if (d.mode === "new") {
    const salt = rid();
    const p = { id: rid(), name, av: d.av, salt, hash: await hashPin(d.pin1, salt), created: Date.now(), st: newStats() };
    DB.profiles.push(p); save();
    S.draft = null; go({ view:"intro", me:p.id, tab:"jogos", topic:null, introMsg:"Perfil criado." });
  } else {
    const p = byId(d.id); p.name = name; p.av = d.av;
    if (wantsPin) { p.salt = rid(); p.hash = await hashPin(d.pin1, p.salt); }
    save(); S.draft = null;
    if (S.me === p.id) go({ view:"app", tab:"perfil" }); else go({ view:"picker", manage:false });
    toast("Perfil salvo.");
  }
}

function vPin() {

async function pinPress(k) {
  if (S.pin.busy) return;
  if (k === "del") S.pin.val = S.pin.val.slice(0, -1);
  else if (S.pin.val.length < 4) S.pin.val += k;
  S.pin.err = ""; S.pin.shake = false;
  if (S.pin.val.length === 4) {
    S.pin.busy = true; render();
    const p = byId(S.pin.id);
    const ok = (await hashPin(S.pin.val, p.salt)) === p.hash;
    S.pin.busy = false;
    if (ok) {
      if (S.pin.purpose === "manage") { S.draft = { mode:"edit", id:p.id, name:p.name, av:{ ...p.av }, pin1:"", pin2:"" }; S.pin = null; go({ view:"editor" }); }
      else { S.pin = null; go({ view:"intro", me:p.id, tab:"jogos", topic:null, introMsg:null }); }
      return;
    }
    S.pin.val = ""; S.pin.err = "PIN errado. Tente de novo."; S.pin.shake = true;
  }
  render();
}

const EZ = { enter:"cubic-bezier(.16,1,.3,1)", move:"cubic-bezier(.76,0,.24,1)", exit:"cubic-bezier(.7,0,.84,0)", pop:"cubic-bezier(.34,1.56,.64,1)" };
const INTRO_END = 8950;
function runIntro() {

  }
  /* Cena 1 (0–1,5 s): barra de busca entra, encolhe até virar cursor e some */

  /* Cena 2 (1,45–3,5 s): verbos da disciplina, um por vez, com desfoque */

    const last = i === all.length - 1;

  });
  /* Cena 5 (6,7–8,9 s): fundo preto, logo ARENA e o avatar do aluno */

  letters.forEach((el, i) => an(el, [{ opacity:0, filter:"blur(12px)", transform:"translateY(.25em)" }, { opacity:1, filter:"blur(0)", transform:"none" }], { duration:700, delay:7050 + i * 50, easing:EZ.enter }));

      <div class="chips" role="group" aria-label="Tópico"><button class="chip" data-a="pickTopic" data-t="0" aria-pressed="${!m.t}">Todos os tópicos</button>${ts.map(t => `<button class="chip" data-a="pickTopic" data-t="${t}" aria-pressed="${m.t === t}">${pad2(t)} · ${esc(topicName(t))}</button>`).join("")}</div>
      <div class="actions"><button class="btn" data-a="startGame" data-g="${g.id}" data-t="${m.t || 0}" data-autofocus>Começar</button><button class="btn ghost" data-a="closeModal">Cancelar</button></div>`;
  } else if (m.type === "quit") {
    inner = `<h2>Sair do jogo?</h2><p>Os acertos desta partida não entram no ranking.</p>
      <div class="actions"><button class="btn" data-a="closeModal" data-autofocus>Continuar jogando</button><button class="btn ghost" data-a="quitGame">Sair</button></div>`;
  } else if (m.type === "delete") {
    const p = byId(m.id);
    inner = `<h2>Excluir ${esc(p.name)}?</h2><p>Acertos, recordes e o avatar somem deste aparelho. Não dá para desfazer sem o código de backup.</p>
      <div class="actions"><button class="btn danger" data-a="doDelete">Excluir perfil</button><button class="btn" data-a="closeModal" data-autofocus>Manter perfil</button></div>`;
  } else if (m.type === "import") {
    inner = `<h2>Importar perfil</h2><p>Cole o código de backup gerado na aba Perfil.</p>
      <label for="imp" class="sr">Código de backup</label><textarea id="imp" class="code" placeholder="ATC1.…" data-autofocus></textarea>
      <p class="err" id="imperr" role="alert"></p>
      <div class="actions"><button class="btn" data-a="doImport">Importar</button><button class="btn ghost" data-a="closeModal">Cancelar</button></div>`;
  }
  return `<div class="overlay" data-a="overlay"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`;
}
function doImport() {
  const v = (document.getElementById("imp").value || "").trim(), err = document.getElementById("imperr");
  try {
    if (!v.startsWith("ATC1.")) throw 0;
    const p = JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));
    if (!p || !p.id || !p.name || !p.av || !p.hash || !p.salt) throw 0;
    p.st = Object.assign(newStats(), p.st || {});
    const i = DB.profiles.findIndex(x => x.id === p.id);
    if (i >= 0) DB.profiles[i] = p;
    else {
      let n = p.name, k = 2; while (DB.profiles.some(x => x.name.toLowerCase() === n.toLowerCase())) n = `${p.name.slice(0, 13)} ${k++}`;
      p.name = n; DB.profiles.push(p);
    }
    save(); S.modal = null; render(); toast(`Perfil ${p.name} importado.`);
  } catch (e) { err.textContent = "Código inválido. Copie o código inteiro e tente de novo."; }
}

/* ---------- Motor de jogo ---------- */
function startGame(gid, topic) {
  clearTimers();
  const g = gameById(gid), only = topicsOf(g), t = Number(topic) || (only.length === 1 ? only[0] : 0);
  const pool = g.bank().filter(x => !t || x.t === t);
  const G = { id:gid, name:g.name, color:g.c, topic:t, hits:0, misses:0, streak:0, bestStreak:0, bt:{}, done:false };
  GM[gid].start(G, pool);
  S.G = G; S.modal = null; go({ view:"game" });
}
function mark(G, ok, t) {
  try { if (navigator.vibrate) navigator.vibrate(ok ? 12 : [24, 40, 24]); } catch (e) {}
  const b = G.bt[t] || (G.bt[t] = { h:0, m:0 });
  if (ok) { G.hits++; G.streak++; b.h++; G.bestStreak = Math.max(G.bestStreak, G.streak); }
  else { G.misses++; G.streak = 0; b.m++; }
}
function finish(G) {
  if (G.done) return;
  clearTimers(); G.done = true;
  const p = me(), st = p.st;
  const prev = st.bg[G.id] ? st.bg[G.id].best : 0;
  st.h += G.hits; st.m += G.misses; st.g += 1; st.best = Math.max(st.best, G.bestStreak);
  for (const [t, b] of Object.entries(G.bt)) { const x = st.bt[t] || (st.bt[t] = { h:0, m:0 }); x.h += b.h; x.m += b.m; }
  const gb = st.bg[G.id] || (st.bg[G.id] = { best:0, plays:0 });
  gb.plays++; gb.best = Math.max(gb.best, G.hits);
  G.record = G.hits > prev && G.hits > 0;
  save(); render();
}
function vGame() {
  const G = S.G;
  const head = `<header class="ghead wrap">
    <button class="round" data-a="${G.done ? "quitGame" : "askQuit"}" aria-label="Sair do jogo">${ic("close", 18)}</button>
    <div class="ttl"><b>${G.name}</b><small>${G.topic ? `Tópico ${pad2(G.topic)} · ${esc(topicName(G.topic))}` : "Todos os tópicos"}</small></div>
    <div class="score"><b class="h">${G.hits}</b> acertos<i></i><b>${G.misses}</b> erros</div>
  </header><div class="wrap"${GM[G.id].timed && !G.done ? "" : " hidden"}><div class="timer"><i id="tbar" style="--p:${G.p ?? 1}"></i></div></div>`;
  const body = G.done ? vResult(G) : GM[G.id].view(G);
  return `<div class="stage full" style="--c:${G.color};--ct:${tint(G.color)}">${head}<main class="play wrap" aria-live="polite">${body}</main></div>`;
}
function vResult(G) {
  const p = me();
  return `<section class="result">
    ${G.record ? `<span class="rec-tag">Novo recorde</span>` : `<p class="eyebrow">Fim de jogo</p>`}
    <div class="big">${G.hits}</div>
    <h2 style="font-size:26px">acertos</h2>
    <p class="muted" style="margin:0">${pct(G.hits, G.misses)}% de precisão · maior sequência ${G.bestStreak} · ${posOf(p.id)}º no ranking</p>
    <div class="actions" style="justify-content:center;margin-top:10px"><button class="btn" data-a="startGame" data-g="${G.id}" data-t="${G.topic}" data-autofocus>Jogar de novo</button><button class="btn ghost" data-a="quitGame">Outros jogos</button></div>
  </section>`;
}
function tick(G, total, onEnd) {
  const t0 = Date.now(), iv = setInterval(() => {
    const p = Math.max(0, 1 - (Date.now() - t0) / total); G.p = p;
    const el = document.getElementById("tbar"); if (el) el.style.setProperty("--p", p);
    if (p <= 0) { clearInterval(iv); onEnd(); }
  }, 100);
  timers.push(iv); return iv;
}
const progress = (a, b, extra = "") => `<div class="progress"><span>${a}</span><span>${b}</span>${extra}</div>`;
const tagT = t => `<span class="tag">Tópico ${pad2(t)}</span>`;
const emptyGame = () => `<div class="empty">Não há conteúdo deste jogo para o tópico escolhido.<br><br><button class="btn ghost small" data-a="quitGame">Voltar</button></div>`;

const GM = {};

/* Quiz relâmpago */
GM.quiz = {
  timed: true,
  start(G, pool) { G.items = shuffle(pool).slice(0, 10).map(q => ({ ...q, o: shuffle(q.a.map((x, i) => ({ x, c: i === 0 }))) })); G.i = 0; G.ans = null; },
  view(G) {
    if (!G.items.length) return emptyGame();
    const q = G.items[G.i], L = "ABCD";
    const answers = q.o.map((o, i) => { let cls = ""; if (G.ans !== null) { if (o.c) cls = "right"; else if (i === G.ans) cls = "wrong"; else cls = "fade"; }
      return `<button class="ans ${cls}" data-a="quizAns" data-i="${i}" ${G.ans !== null ? "disabled" : ""}><span class="k">${L[i]}</span><span>${esc(o.x)}</span></button>`; }).join("");
    let fb = "";
    if (G.ans !== null) { const ok = G.ans >= 0 && q.o[G.ans].c;
      fb = `<div class="feedback ${ok ? "ok" : "no"}"><div><b>${ok ? "Acertou." : G.ans < 0 ? "Tempo esgotado." : "Não foi dessa vez."}</b>${esc(q.e)}</div></div>
        <div class="nextbar"><button class="btn" data-a="quizNext" data-autofocus>${G.i + 1 < G.items.length ? "Próxima" : "Ver resultado"}</button></div>`; }
    return `${progress(`Pergunta ${G.i + 1} de ${G.items.length}`, G.streak > 1 ? `<span class="streak">Sequência de ${G.streak}</span>` : "")}${tagT(q.t)}
      <h2 class="qtext">${esc(q.q)}</h2><div class="answers">${answers}</div>${fb}`;
  },
  after(G) { if (G.items.length && G.ans === null && !G.running) { G.running = true; G.p = 1; tick(G, 20000, () => { G.running = false; GM.quiz.answer(G, -1); }); } },
  answer(G, i) {
    if (G.ans !== null) return; clearTimers(); G.running = false;
    const q = G.items[G.i]; G.ans = i; mark(G, i >= 0 && q.o[i].c, q.t); render();
  },
  next(G) { if (G.i + 1 >= G.items.length) return finish(G); G.i++; G.ans = null; G.p = 1; render(); }
};

/* Verdadeiro ou falso */
GM.vf = {
  timed: true,
  start(G, pool) { G.pool = pool; G.deck = shuffle(pool); G.k = 0; G.fb = null; G.p = 1; },
  cur(G) { if (G.k >= G.deck.length) { G.deck = shuffle(G.pool); G.k = 0; } return G.deck[G.k]; },
  view(G) {
    if (!G.pool.length) return emptyGame();
    const s = this.cur(G), fb = G.fb;
    return `${progress(`${G.hits + G.misses} respondidas`, G.streak > 1 ? `<span class="streak">Sequência de ${G.streak}</span>` : "")}
      <div class="vfcard ${fb ? (fb.ok ? "ok" : "no") : ""}">${tagT(s.t)}<p class="qtext">${esc(s.s)}</p>
      ${fb ? `<p style="font-weight:600">${fb.ok ? "Certo." : `Errado. É ${s.v ? "verdadeiro" : "falso"}.`} <span class="muted" style="font-weight:400">${esc(s.e)}</span></p>` : ""}</div>
      <div class="vfbtns"><button class="f" data-a="vfAns" data-v="0" ${fb ? "disabled" : ""}>Falso<span class="kbd">tecla ←</span></button><button class="v" data-a="vfAns" data-v="1" ${fb ? "disabled" : ""}>Verdadeiro<span class="kbd">tecla →</span></button></div>`;
  },
  after(G) { if (G.pool.length && !G.running) { G.running = true; tick(G, 60000, () => finish(G)); } },
  answer(G, v) {
    if (G.fb || G.done) return;
    const s = this.cur(G), ok = s.v === v; mark(G, ok, s.t); G.fb = { ok }; render();
    later(() => { if (G.done) return; G.fb = null; G.k++; render(); }, ok ? 650 : 1900);
  }
};

/* Ligue os pares */
GM.pares = {
  start(G, pool) { G.sets = shuffle(pool).slice(0, 3); G.si = -1; this.nextSet(G); },
  nextSet(G) { G.si++; if (G.si >= G.sets.length) return; const s = G.sets[G.si];
    G.L = shuffle(s.p.map((x, i) => i)); G.R = shuffle(s.p.map((x, i) => i)); G.sel = null; G.ok = new Set(); G.bad = null; },
  view(G) {
    if (!G.sets.length) return emptyGame();
    const s = G.sets[G.si];
    const btn = (side, i) => { const done = G.ok.has(i), selected = G.sel && G.sel.side === side && G.sel.i === i, bad = G.bad && G.bad[side] === i;
      return `<button class="pc ${side === "L" ? "term" : ""} ${done ? "done" : ""} ${bad ? "miss" : ""}" data-a="pairPick" data-s="${side}" data-i="${i}" aria-pressed="${!!selected}" ${done ? "disabled" : ""}>${esc(s.p[i][side === "L" ? 0 : 1])}</button>`; };
    return `${progress(`Rodada ${G.si + 1} de ${G.sets.length}`, `${G.ok.size} de ${s.p.length} pares`)}${tagT(s.t)}
      <h2 class="qtext">${esc(s.title)}</h2><p class="muted" style="margin:-8px 0 0">Toque em um termo e depois no conceito que combina.</p>
      <div class="pairs"><div class="pcol">${G.L.map(i => btn("L", i)).join("")}</div><div class="pcol">${G.R.map(i => btn("R", i)).join("")}</div></div>`;
  },
  pick(G, side, i) {
    const s = G.sets[G.si]; G.bad = null;
    if (!G.sel || G.sel.side === side) { G.sel = { side, i }; return render(); }
    const a = G.sel.i; G.sel = null;
    if (a === i) { G.ok.add(i); mark(G, true, s.t); if (G.ok.size === s.p.length) { render(); later(() => { this.nextSet(G); G.si >= G.sets.length ? finish(G) : render(); }, 650); return; } }
    else { mark(G, false, s.t); G.bad = side === "L" ? { L:i, R:a } : { L:a, R:i }; }
    render();
  }
};

/* Classifique */
GM.classe = {
  start(G, pool) { G.sets = shuffle(pool).slice(0, 2); G.si = 0; G.items = G.sets.length ? shuffle(G.sets[0].i) : []; G.k = 0; G.fb = null; },
  view(G) {
    if (!G.sets.length) return emptyGame();
    const s = G.sets[G.si], it = G.items[G.k], fb = G.fb;
    return `${progress(`${s.title}`, `Item ${G.k + 1} de ${G.items.length} · rodada ${G.si + 1}/${G.sets.length}`)}${tagT(s.t)}
      <div class="item ${fb ? (fb.ok ? "ok" : "no") : ""}">${esc(it[0])}</div>
      <p class="muted" style="margin:0;text-align:center">${fb ? (fb.ok ? "Certo." : `É <b style="color:var(--text)">${esc(s.b[it[1]])}</b>.`) : "Para qual caixa vai?"}</p>
      <div class="buckets">${s.b.map((b, i) => `<button class="bucket ${fb && i === it[1] ? "hit" : ""}" data-a="sortPick" data-i="${i}" ${fb ? "disabled" : ""}>${esc(b)}</button>`).join("")}</div>`;
  },
  pick(G, i) {
    if (G.fb) return; const s = G.sets[G.si], it = G.items[G.k], ok = i === it[1];
    mark(G, ok, s.t); G.fb = { ok }; render();
    later(() => { G.fb = null; G.k++;
      if (G.k >= G.items.length) { G.si++; if (G.si >= G.sets.length) return finish(G); G.items = shuffle(G.sets[G.si].i); G.k = 0; }
      render(); }, ok ? 600 : 1400);
  }
};

/* Ordem certa + Monte a referência (mesma mecânica) */
const seqGame = (isRef) => ({
  start(G, pool) { G.sets = shuffle(pool).slice(0, isRef ? 4 : 2); G.si = 0; this.load(G); },
  load(G) { const s = G.sets[G.si]; if (!s) return; const steps = isRef ? s.p : s.s; G.steps = steps; G.pool = shuffle(steps.map((x, i) => i)); G.placed = []; G.bad = null; G.lock = false; },
  view(G) {
    if (!G.sets.length) return emptyGame();
    const s = G.sets[G.si], left = G.pool.filter(i => !G.placed.includes(i));
    const picks = left.map(i => `<button class="pick ${isRef ? "ref" : ""} ${G.bad === i ? "miss" : ""}" data-a="seqPick" data-i="${i}">${isRef ? bold(G.steps[i]) : esc(G.steps[i])}</button>`).join("");
    if (isRef) {
      const line = G.placed.map(i => bold(G.steps[i])).join(" ");
      return `${progress(`Referência ${G.si + 1} de ${G.sets.length}`, `${G.placed.length} de ${G.steps.length} partes`)}<span class="tag">Tipo: ${esc(s.type)}</span>
        <h2 class="qtext">Toque nas partes na ordem certa.</h2>
        <div class="paper"><span class="ruler">margem 3 cm</span>${line}${G.placed.length < G.steps.length ? '<span class="caret"></span>' : ""}</div>
        <div class="pool">${picks}</div>`;
    }
    const slots = G.placed.map((i, n) => `<div class="slot"><span class="n">${pad2(n + 1)}</span><span>${esc(G.steps[i])}</span></div>`).join("") +
      (G.placed.length < G.steps.length ? `<div class="slot empty"><span class="n">${pad2(G.placed.length + 1)}</span><span>Qual vem agora?</span></div>` : "");
    return `${progress(`Rodada ${G.si + 1} de ${G.sets.length}`, `${G.placed.length} de ${G.steps.length} etapas`)}${tagT(s.t)}
      <h2 class="qtext">${esc(s.title)}</h2><div class="slots">${slots}</div><div class="pool">${picks}</div>`;
  },
  pick(G, i) {
    if (G.lock) return; const s = G.sets[G.si], t = isRef ? 7 : s.t;
    G.bad = null;
    if (i === G.placed.length) { G.placed.push(i); mark(G, true, t); }
    else { mark(G, false, t); G.bad = i; }
    if (G.placed.length === G.steps.length) { G.lock = true; render(); later(() => { G.si++; if (G.si >= G.sets.length) return finish(G); this.load(G); render(); }, isRef ? 1300 : 800); return; }
    render();
  }
});
GM.ordem = seqGame(false);
GM.abnt = seqGame(true);

/* Caça ao ruído */
GM.ruido = {
  start(G, pool) { G.items = shuffle(pool).slice(0, 8); G.i = 0; G.ans = null; },
  view(G) {
    if (!G.items.length) return emptyGame();
    const q = G.items[G.i];
    const opts = q.o.map((s, i) => { let cls = "", mk = ""; if (G.ans !== null) { if (i === q.c) { cls = "right"; mk = "com problema"; } else if (i === G.ans) cls = "wrong"; }
      return `<button class="sent ${cls}" data-a="noiseAns" data-i="${i}" ${G.ans !== null ? "disabled" : ""}>${mk ? `<span class="mk" style="color:#0c7a57">${mk}</span>` : ""}${esc(s)}</button>`; }).join("");
    let fb = "";
    if (G.ans !== null) { const ok = G.ans === q.c;
      fb = `<div class="feedback ${ok ? "ok" : "no"}"><div><b>${ok ? "Achou." : "Não é essa."}</b>${esc(q.e)}</div></div>
        <div class="nextbar"><button class="btn" data-a="noiseNext" data-autofocus>${G.i + 1 < G.items.length ? "Próxima" : "Ver resultado"}</button></div>`; }
    return `${progress(`Frase ${G.i + 1} de ${G.items.length}`, G.streak > 1 ? `<span class="streak">Sequência de ${G.streak}</span>` : "")}${tagT(q.t)}
      <h2 class="qtext">${esc(q.q)}</h2><div class="opts3">${opts}</div>${fb}`;
  },
  answer(G, i) { if (G.ans !== null) return; const q = G.items[G.i]; G.ans = i; mark(G, i === q.c, q.t); render(); },
  next(G) { if (G.i + 1 >= G.items.length) return finish(G); G.i++; G.ans = null; render(); }
};

/* ---------- Ações ---------- */
const A = {
  pickProfile(el) { S.pin = { id: el.dataset.id, val:"", purpose: S.manage ? "manage" : "enter" }; go({ view:"pin" }); },
  newProfile() { S.draft = { mode:"new", name:"", av: randAv(), pin1:"", pin2:"" }; go({ view:"editor" }); },
  toggleManage() { go({ manage: !S.manage }); },
  skipIntro() { window.__introHold = false; endIntro(); },
  toPicker() { clearTimers(); S.pin = null; go({ view:"picker", me:null, manage:false, topic:null }); },
  editorBack() { const d = S.draft; S.draft = null; if (d && d.mode === "edit" && S.me === d.id) go({ view:"app", tab:"perfil" }); else go({ view:"picker", manage:false }); },
  randomAv() { S.draft.av = randAv(); refreshAvatar(); },
  setAv(el) { S.draft.av[el.dataset.k] = Number(el.dataset.v); refreshAvatar(); },
  askDelete() { S.modal = { type:"delete", id: S.draft.id }; render(); },
  doDelete() { const id = S.modal.id; DB.profiles = DB.profiles.filter(p => p.id !== id); save(); S.modal = null; S.draft = null; const wasMe = S.me === id; go({ view:"picker", manage: !wasMe && DB.profiles.length > 0, me: wasMe ? null : S.me }); toast("Perfil excluído."); },
  pinKey(el) { pinPress(el.dataset.k); },
  pinDel() { pinPress("del"); },
  tab(el) { go({ tab: el.dataset.t, topic:null }); },
  openTopic(el) { go({ view:"app", tab:"resumos", topic: Number(el.dataset.t) }); },
  closeTopic() { go({ topic:null }); },
  editMe() { const p = me(); S.draft = { mode:"edit", id:p.id, name:p.name, av:{ ...p.av }, pin1:"", pin2:"" }; go({ view:"editor" }); },
  copyBackup() {
    const txt = document.getElementById("bk").textContent;
    try { navigator.clipboard.writeText(txt).then(() => toast("Código copiado."), () => selectBk()); } catch (e) { selectBk(); }
  },
  openImport() { S.modal = { type:"import" }; render(); },
  doImport() { doImport(); },
  openGame(el) { const g = gameById(el.dataset.g); if (topicsOf(g).length < 2) return startGame(g.id, 0); S.modal = { type:"topic", g:g.id, t:0 }; render(); },
  pickTopic(el) { S.modal.t = Number(el.dataset.t); render(); },
  startGame(el) { startGame(el.dataset.g, el.dataset.t); },
  closeModal() { S.modal = null; render(); },
  overlay(el, e) { if (e.target === el) { S.modal = null; render(); } },
  askQuit() { if (!S.G || S.G.hits + S.G.misses === 0) return A.quitGame(); S.modal = { type:"quit" }; render(); },
  quitGame() { clearTimers(); S.G = null; S.modal = null; go({ view:"app", tab: S.topic ? "resumos" : "jogos" }); },
  quizAns(el) { GM.quiz.answer(S.G, Number(el.dataset.i)); },
  quizNext() { GM.quiz.next(S.G); },
  vfAns(el) { GM.vf.answer(S.G, el.dataset.v === "1"); },
  pairPick(el) { GM.pares.pick(S.G, el.dataset.s, Number(el.dataset.i)); },
  sortPick(el) { GM.classe.pick(S.G, Number(el.dataset.i)); },
  seqPick(el) { GM[S.G.id].pick(S.G, Number(el.dataset.i)); },
  noiseAns(el) { GM.ruido.answer(S.G, Number(el.dataset.i)); },
  noiseNext() { GM.ruido.next(S.G); }
};
function selectBk() { const el = document.getElementById("bk"); const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Código selecionado. Copie com Ctrl+C."); }

app.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.dataset.a === "overlay") return fn(el, e);
  e.preventDefault(); fn(el, e);
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  if (S.modal && e.key === "Escape") { S.modal = null; return render(); }
  if (S.view === "intro" && (e.key === "Escape" || e.key === "Enter")) return endIntro();
  if (S.view === "pin" && !S.modal) { if (/^\d$/.test(e.key)) pinPress(e.key); else if (e.key === "Backspace") pinPress("del"); return; }
  if (S.view !== "game" || !S.G || S.G.done || S.modal) return;
  const G = S.G;
  if (G.id === "vf") { if (e.key === "ArrowLeft") GM.vf.answer(G, false); if (e.key === "ArrowRight") GM.vf.answer(G, true); }
  if (G.id === "quiz" && G.ans === null) { const i = "1234".indexOf(e.key) >= 0 ? "1234".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase()); if (i >= 0 && i < 4) GM.quiz.answer(G, i); }
});

load();
render();
})();

</script>
